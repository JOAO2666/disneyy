<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" sizes="32x32" href="./public/disney.png" />
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <title>Disney+ | Clone App</title>

        <script type="text/javascript">
            (function (l) {
                // Clear any infinite loops from old redirected URLs and take user to clean base path
                if (l.search.includes('~and~') || l.search.includes('/&/')) {
                    window.history.replaceState(null, null, l.pathname.split('?')[0]);
                    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/disney-plus-clone/');
                    return;
                }

                if (l.search[1] === "/") {
                    var decoded = l.search
                        .slice(1)
                        .split("&")
                        .map(function (s) {
                            return s.replace(/~and~/g, "&");
                        })
                        .join("?");
                    
                    var newPath = l.pathname.slice(0, -1) + decoded + l.hash;
                    // Prevent double slashes
                    if (newPath.includes('//')) {
                        newPath = newPath.replace(/\/\//g, '/');
                    }
                    window.history.replaceState(null, null, newPath);
                }
            })(window.location);
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
        <script src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js" charset="utf-8" async></script>
    </body>

</html>
